<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy</title>
<style>
:root { color-scheme: light dark; --text: #1b1b1f; --muted: #5f6368; --line: #d7d9dd; --bg: #ffffff; --accent: #0e80fd; }
@media (prefers-color-scheme: dark) { :root { --text: #ececf0; --muted: #a0a4ab; --line: #3a3c42; --bg: #121316; --accent: #5aa7ff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; font-size: 14px; }
nav a { color: var(--accent); text-decoration: none; }
nav a[aria-current] { color: var(--text); font-weight: 600; }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
h2 { font-size: 20px; margin: 32px 0 8px; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
code { font-size: 0.9em; }
.links a { display: block; margin: 8px 0; color: var(--accent); }
</style>
</head>
<body>
<main>

<h1>Privacy Policy</h1>
<div class="links"><a href="en/" hreflang="en">Privacy Policy (English)</a><a href="es/" hreflang="es">Política de privacidad (Español)</a><a href="pt/" hreflang="pt">Política de privacidade (Português)</a><a href="fr/" hreflang="fr">Politique de confidentialité (Français)</a></div>
<script>
var l = (navigator.language || "en").slice(0, 2);
location.replace(["en","es","pt","fr"].indexOf(l) >= 0 ? l + "/" : "en/");
</script>
</main>
</body>
</html>
